[project]
name = "openagent"
version = "0.1.0"
description = "Private coding agent: Nemotron 3 Super + OpenShell + DeepAgents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.4.11,<0.5",
    "langchain>=0.3",
    "langchain-nvidia-ai-endpoints>=0.3",
    "numpy>=2.4.3",
    "pyyaml>=6.0",
    "sentence-transformers>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
openagent = "openagent.cli:main"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
